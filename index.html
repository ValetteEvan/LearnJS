<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test JavaScript</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Bienvenue sur la page de test JavaScript</h1>
    </header>

    <main>
        <section>
            <h2>Interaction avec JavaScript</h2>
            <p id="message">Cliquez sur le bouton pour changer ce texte !</p>
            <button id="changeTextButton">Changer le texte</button>
        </section>

        <section>
            <h2>Calculatrice Simple</h2>
            <input type="number" id="input1" placeholder="Entrez un nombre">
            <input type="number" id="input2" placeholder="Entrez un autre nombre">
            <button id="calculateButton">Calculer la somme</button>
            <p id="result">Le résultat apparaîtra ici</p>
        </section>
    </main>

    <footer>
        <p>Test de code HTML, CSS, et JavaScript. © 2025</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
